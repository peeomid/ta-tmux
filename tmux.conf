# tmux setup for agent sessions (herdr-like). Plain tmux, no plugins.
# Use: run ./install.sh (it adds a source-file line for this file to ~/.tmux.conf).

# --- basics ---------------------------------------------------------------
set -g mouse on
set -g history-limit 50000          # long scrollback for 'ta read'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10               # Esc reaches the agent fast
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g set-titles on                # outer terminal tab shows session:window

# --- "which one needs me" -------------------------------------------------
# Claude Code rings the bell when it waits for you (preferredNotifChannel).
# tmux flags that window until you visit it.
set -g monitor-bell on
set -g bell-action other            # flag bells from windows you are not in
set -g visual-bell off
setw -g window-status-bell-style "fg=black,bg=yellow,bold"

# --- names: Claude windows show the session title  ----------
# Needs CLAUDE_CODE_DISABLE_TERMINAL_TITLE unset or 0.
# The claude program can show as its version number (for example 2.1.318).
set -g @is_claude   '#{||:#{==:#{pane_current_command},claude},#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}}'
set -g @claude_name '#{=/18/…:pane_title}'
set -g automatic-rename-format '#{?#{E:@is_claude},#{E:@claude_name},#{pane_current_command}}'
# 'ta run -n' names a window; keep that name.
set-hook -g after-new-window 'if -F "#{@ta_name}" "setw automatic-rename off"'

# --- status bar -----------------------------------------------------------
# Tab bar on top, like herdr: workspace name, then its tabs (click a tab to open it).
set -g status-position top
set -g status-style "bg=colour236,fg=colour250"
set -g window-status-separator ""
set -g status-interval 5
# With the sidebar on, the left part is as wide as the sidebar (30 + 1 border),
# so the tabs start right above the panes, like herdr. #{p31:x} pads x to 31.
set -g status-left-length 40
set -g status-left "#{?#{==:#{@ta_sidebar},on},#[bg=default#,fg=colour245]#{p31: #{session_name}},#[bold] #S }#[default]"
set -g window-status-format " #I:#W#{?#{@ta_harness}, ·#{@ta_harness},} "
set -g window-status-current-format "#[bg=colour31,fg=white,bold] #I:#W#{?#{@ta_harness}, ·#{@ta_harness},} #[default]"
# Line 1: tabs of this workspace. Line 2: all workspaces + agent counts
# (like the herdr sidebar). The bar call also saves a snapshot every 30 s.
set -g status 2
# Backup for the sidebar hooks: every 5 s (status-interval) the tab you look
# at gets its sidebar back if a hook missed it. side-ensure prints nothing.
set -g status-right "#(ta ws save --every 30)#(ta ws side-ensure #{window_id})%H:%M "
set -g status-format[1] "#[align=left] #(ta ws bar '#{client_session}')"

# --- keys -----------------------------------------------------------------
# prefix s / w : tree of sessions and windows (built in)
# prefix a     : live agent list in a popup
bind a display-popup -w 90% -h 60% -E "ta top"
# prefix N     : new agent here (asks harness + task)
bind N command-prompt -p "harness:,task:" "run-shell 'ta run -C \"#{pane_current_path}\" %1 \"%2\" >/dev/null'"
# prefix d / D : detach (get out). tmux's own D = "pick a client to detach",
#                a list that looks like the workspace list. Make D = d.
bind D detach-client
# prefix F     : layout looks broken -> repair it (ta fix)
bind F run-shell "ta fix"
# prefix | / _ : this pane + next pane side by side / on top of each other.
#                The sidebar stays (tmux's own Ctrl-b Space moves it too).
bind | run-shell "ta ws turn h #{pane_id}"
bind _ run-shell "ta ws turn v #{pane_id}"
# prefix B     : jump to the next window with a bell
bind B next-window -a

# --- workspaces (1 workspace = 1 tmux session) ---------------------------
# prefix w     : pick a workspace / tab / pane (tree, with preview)
bind w choose-tree -Zs
# prefix W     : new workspace (asks name + folder)
bind W command-prompt -p "workspace name:,folder:" -I ",#{pane_current_path}" "run-shell \"ta ws new '%1' '%2'\""
# prefix ( / ) : previous / next workspace (built in)
# prefix $     : rename workspace (built in);  prefix , : rename tab
# prefix S     : save workspaces now
bind S run-shell "ta ws save"
# Do not close tmux when you close the last pane of a workspace.
set -g detach-on-destroy off

# --- sidebar: workspace list on the left, like herdr ---------------------
# A narrow pane (ta ws side) on the left of the window you look at. Click a
# workspace or tab to open it. Keys in the sidebar: 1-9, ? (help).
# prefix e : show / hide the sidebar (when hidden, status line 2 comes back)
bind e run-shell "ta ws sidebar toggle"
# prefix ?     : key help grouped by workspace / tab / pane (tmux's own list: prefix K)
bind ? display-popup -w 96 -h 90% -E "ta ws help | less -R -~ -P' q = close '"
bind K list-keys -N
set -g @ta_sidebar on
set -g status on
set-hook -g client-session-changed 'run-shell -b "ta ws side-ensure #{window_id}"'
set-hook -g client-attached        'run-shell -b "ta ws side-ensure #{window_id}"'
set-hook -g session-window-changed 'run-shell -b "ta ws side-ensure #{window_id}"'
set-hook -g 'after-new-window[1]'  'run-shell -b "ta ws side-ensure #{window_id}"'
set-hook -g pane-exited            'run-shell -b "ta ws side-ensure"'
set-hook -g after-kill-pane        'run-shell -b "ta ws side-ensure"'
set -g pane-border-lines single
